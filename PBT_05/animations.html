<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transitions & Animations Playground</title>
    <link rel="stylesheet" href="animations.css">
</head>
<body>

    <div class="playground-container">
        <h1 class="page-title">CSS Animations & Transitions Playground</h1>

        <div class="spinner-section">
            <p>Đang tải dữ liệu hệ thống...</p>
            <div class="loading-spinner"></div>
        </div>

        <div class="product-grid">

            <div class="product-card fade-in-element">
                <div class="img-container">
                    <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400" alt="Giày Sneaker">
                </div>
                <div class="card-info">
                    <h3 class="product-title">Giày Red Sneaker Pro</h3>
                    <p class="product-price">1.500.000đ</p>
                    <button class="btn-buy">Mua ngay</button>
                </div>
            </div>

            <div class="product-card fade-in-element">
                <div class="img-container">
                    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400" alt="Đồng hồ">
                </div>
                <div class="card-info">
                    <h3 class="product-title">Đồng Hồ Classic Minimalist</h3>
                    <p class="product-price">2.800.000đ</p>
                    <button class="btn-buy">Mua ngay</button>
                </div>
            </div>

            <div class="product-card fade-in-element">
                <div class="img-container">
                    <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400" alt="Tai nghe">
                </div>
                <div class="card-info">
                    <h3 class="product-title">Tai Nghe Studio Wireless</h3>
                    <p class="product-price">3.200.000đ</p>
                    <button class="btn-buy">Mua ngay</button>
                </div>
            </div>

            <div class="product-card fade-in-element">
                <div class="img-container">
                    <img src="https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=400" alt="Kính râm">
                </div>
                <div class="card-info">
                    <h3 class="product-title">Kính Râm Thời Trang Aviator</h3>
                    <p class="product-price">650.000đ</p>
                    <button class="btn-buy">Mua ngay</button>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
