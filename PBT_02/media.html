<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Product Page</title>
</head>
<body>

    <header>
        <h1>Giới thiệu iPhone 16</h1>
    </header>

    <main>

    
        <section>

            <h2>Hình ảnh sản phẩm</h2>

            <!-- Ảnh 1 -->
            <figure>

                <img
                    src="c:\Users\PC\OneDrive\Pictures\iPhone-16-Side-Feature.jpg"
                    alt="iPhone 16 Pro Max màu titan mặt trước"
                    loading="lazy"
                    style="max-width: 100%; height: auto;">

                <figcaption>
                    iPhone 16 Pro Max - Mặt trước
                </figcaption>

            </figure>

            <!-- Ảnh 2 -->
            <figure>

                <img
                    src="c:\Users\PC\OneDrive\Pictures\iPhone-16-Side-2-Feature.jpg"
                    alt="Mặt sau iPhone 16 Pro Max "
                    loading="lazy"
                    style="max-width: 100%; height: auto;">

                <figcaption>
                    Thiết kế mặt lưng sang trọng
                </figcaption>

            </figure>

            <!-- Ảnh 3 -->
            <figure>

                <img
                    src="c:\Users\PC\OneDrive\Pictures\tLpZeij2nfAbQbCh6AU4qm-970-80.jpg"
                    alt="Camera iPhone 16 Pro Max cận cảnh"
                    loading="lazy"
                    style="max-width: 100%; height: auto;">

                <figcaption>
                    Camera chất lượng cao
                </figcaption>

            </figure>

        </section>

        <hr>

        
        <section>

            <h2>Video giới thiệu YouTube</h2>

            <iframe
                width="560"
                height="315"
                src="https://www.youtube.com/embed/aY-vNNoRfxg"
                title="Video giới thiệu iPhone 16"
                allowfullscreen>
            </iframe>

        </section>

        <hr>

    
        <section>

            <h2>Video HTML5</h2>

            <video
                controls
                width="600"
                poster="https://placehold.co/600x300">

                <!-- Source MP4 -->
                <source
                    src="video.mp4"
                    type="video/mp4">

                <!-- Source WEBM -->
                <source
                    src="video.webm"
                    type="video/webm">

                

            </video>

        </section>

        <hr>

    
        <section>

            <h2>Audio giới thiệu</h2>

            <audio controls>

                <source
                    src="audio.mp3"
                    type="audio/mpeg">

                <source
                    src="audio.ogg"
                    type="audio/ogg">

                

            </audio>

        </section>

        <hr>

    
        <section>

            <h2>Logo SVG</h2>

            <svg width="200" height="200">

                <!-- Hình tròn -->
                <circle
                    cx="100"
                    cy="100"
                    r="70"
                    stroke="black"
                    stroke-width="4"
                    fill="lightblue">
                </circle>


                <text
                    x="70"
                    y="110"
                    font-size="24">

                    TLU

                </text>

            </svg>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 iPhone Store</p>
    </footer>

</body>
</html>
