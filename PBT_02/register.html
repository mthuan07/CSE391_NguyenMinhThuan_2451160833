<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản</title>
</head>
<body>

    <h1>Form Đăng Ký Tài Khoản E-Commerce</h1>

    <form action="#" method="POST">

        <!-- Fieldset 1 -->
        <fieldset>
            <legend>Thông tin cá nhân</legend>

            <label for="fullname">Họ tên:</label><br>
            <input 
                type="text"
                id="fullname"
                name="fullname"
                placeholder="Nhập họ tên"
                required
                minlength="2"
                maxlength="50">
            <br><br>

            <label for="email">Email:</label><br>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="example@gmail.com"
                required>
            <br><br>

            <label for="phone">Số điện thoại:</label><br>
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="0123456789"
                pattern="[0-9]{10}"
                required>
            <br><br>

            <label for="birthday">Ngày sinh:</label><br>
            <input
                type="date"
                id="birthday"
                name="birthday"
                max="2026-05-09"
                required>
            <br><br>

        </fieldset>

        <br>

        <!-- Fieldset 2 -->
        <fieldset>
            <legend>Tài khoản</legend>

            <label for="username">Username:</label><br>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="username_123"
                pattern="[A-Za-z0-9_]{3,20}"
                required>
            <br><br>

            <label for="password">Password:</label><br>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Nhập mật khẩu"
                minlength="8"
                pattern="(?=.*[A-Z])(?=.*[0-9]).{8,}"
                required>
            <br><br>

            <label for="confirm-password">Xác nhận password:</label><br>
            <input
                type="password"
                id="confirm-password"
                name="confirm-password"
                placeholder="Nhập lại mật khẩu"
                minlength="8"
                pattern="(?=.*[A-Z])(?=.*[0-9]).{8,}"
                required>
            <br><br>

        </fieldset>

        <br>

        <!-- Fieldset 3 -->
        <fieldset>
            <legend>Thông tin giao hàng</legend>

            <label for="city">Thành phố:</label><br>
            <select id="city" name="city" required>
                <option value="">-- Chọn thành phố --</option>
                <option>Hà Nội</option>
                <option>Hồ Chí Minh</option>
                <option>Đà Nẵng</option>
                <option>Hải Phòng</option>
                <option>Cần Thơ</option>
            </select>
            <br><br>

            <label for="district">Quận/Huyện:</label><br>
            <select id="district" name="district" required>
                <option value="">-- Chọn quận/huyện --</option>
                <option>Ba Đình</option>
                <option>Cầu Giấy</option>
                <option>Đống Đa</option>
                <option>Thanh Xuân</option>
            </select>
            <br><br>

            <label for="address">Địa chỉ chi tiết:</label><br>
            <textarea
                id="address"
                name="address"
                rows="3"
                placeholder="Nhập địa chỉ chi tiết"></textarea>
            <br><br>

            <p>Giới tính:</p>

            <input type="radio" id="male" name="gender">
            <label for="male">Nam</label>

            <input type="radio" id="female" name="gender">
            <label for="female">Nữ</label>

            <input type="radio" id="other" name="gender">
            <label for="other">Khác</label>

            <br><br>

        </fieldset>

        <br>

        <input type="checkbox" id="terms" required>
        <label for="terms">Tôi đồng ý với điều khoản sử dụng</label>

        <br><br>

        <button type="submit">Đăng ký</button>
        <button type="reset">Reset</button>

    </form>

</body>
</html>
